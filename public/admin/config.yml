backend:
  name: github
  repo: Poorya-Zare/poorya-zare.github.io
  branch: main
  base_url: https://poorya-portfolio-auth.pooryazare-2019.workers.dev
  auth_endpoint: auth

media_folder: "public/uploads"
public_folder: "/uploads"

publish: true

collections:
  - name: "portfolio"
    label: "Portfolio"
    files:
      - name: "site_content"
        label: "Website Content"
        file: "content/site.yml"
        fields:
          - label: "Full Name"
            name: "full_name"
            widget: "string"
            required: true

          - label: "Professional Title"
            name: "professional_title"
            widget: "string"
            required: true

          - label: "About Me"
            name: "about"
            widget: "text"
            required: false

          - label: "Projects"
            name: "projects"
            widget: "list"
            required: false
            fields:
              - label: "Project Title"
                name: "title"
                widget: "string"

              - label: "Description"
                name: "description"
                widget: "text"

              - label: "Technologies"
                name: "technologies"
                widget: "list"
                required: false
                field:
                  label: "Technology"
                  name: "technology"
                  widget: "string"
