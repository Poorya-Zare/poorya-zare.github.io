backend:
  name: github
  repo: Poorya-Zare/poorya-zare.github.io
  branch: main
  base_url: https://poorya-portfolio-auth.pooryazare-2019.workers.dev
  auth_endpoint: auth

media_folder: "public/uploads"
public_folder: "/uploads"

publish: true

collections:
  - name: "portfolio"
    label: "Portfolio"
    files:
      - name: "site_content"
        label: "Website Content"
        file: "content/site.yml"

        fields:
          - label: "Profile"
            name: "profile"
            widget: "object"
            collapsed: false
            fields:
              - label: "Profile Photo"
                name: "photo"
                widget: "image"
                required: false
                default: "/profile.jpg"

              - label: "Hero Description"
                name: "hero_description"
                widget: "text"
                required: false

              - label: "Availability Status"
                name: "availability"
                widget: "string"
                required: false

          - label: "Full Name"
            name: "full_name"
            widget: "string"
            required: true

          - label: "Professional Title"
            name: "professional_title"
            widget: "string"
            required: true
            hint: "Separate roles with |"

          - label: "About Me"
            name: "about"
            widget: "text"
            required: false

          - label: "Research Domains"
            name: "research_domains"
            widget: "list"
            required: false
            fields:
              - label: "Domain Title"
                name: "title"
                widget: "string"

              - label: "Description"
                name: "description"
                widget: "text"

              - label: "Icon"
                name: "icon"
                widget: "select"
                required: false
                options:
                  - "brain"
                  - "shield"
                  - "cpu"

          - label: "Projects"
            name: "projects"
            widget: "list"
            required: false
            fields:
              - label: "Project Title"
                name: "title"
                widget: "string"

              - label: "Category"
                name: "category"
                widget: "string"
                required: false

              - label: "Description"
                name: "description"
                widget: "text"

              - label: "Technologies"
                name: "technologies"
                widget: "list"
                required: false
                field:
                  label: "Technology"
                  name: "technology"
                  widget: "string"

          - label: "Skills"
            name: "skills"
            widget: "list"
            required: false
            field:
              label: "Skill"
              name: "skill"
              widget: "string"

          - label: "Contact"
            name: "contact"
            widget: "object"
            required: false
            fields:
              - label: "Email"
                name: "email"
                widget: "string"
                required: false

              - label: "GitHub URL"
                name: "github"
                widget: "string"
                required: false

              - label: "LinkedIn URL"
                name: "linkedin"
                widget: "string"
                required: false

              - label: "Contact Description"
                name: "description"
                widget: "text"
                required: false
